# Azure DevOps pipeline template used to build bundle.
parameters:
  - name: 'env'
    type: string
    default: ''

  - name: 'vite_deploy_path'
    type: string
    default: ''

  - name: 'vite_api_timeout'
    type: string
    default: ''

  - name: 'vite_apihost'
    type: string
    default: ''

  - name: 'vite_apihost_fileshare'
    type: string
    default: ''

  - name: 'vite_login_url'
    type: string
    default: ''

  - name: 'vite_resources_url'
    type: string
    default: ''

steps:
  - bash: |
      chmod +x env.sh
      env -i \
      ENV=${{ parameters.env }} \
      $(env | while IFS='=' read -r k v; do case "$k" in "${{ parameters.env }}_VITE"*) printf '%s=%q ' "$k" "$v";; esac; done) \
      bash env.sh

    displayName: 'Populate environment file'
