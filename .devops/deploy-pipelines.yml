# Azure DevOps pipeline to release a new version and deploy to production.
trigger:
  branches:
    include:
      - develop
      - uat
      - main
  paths:
    include:
      - src/*

pr: none

variables:
  NODE_VERSION: '22.12.0'
  vmImageNameDefault: 'ubuntu-latest'
  blob_container_path: 'piattaformaunitaria'

  environment: 'UAT'
  azure_subscription: '$(UAT_AZURE_SUBSCRIPTION)'
  cdn_endpoint: '$(UAT_CDN_ENDPOINT)'
  cdn_profile: '$(UAT_CDN_PROFILE)'
  cdn_domains: '$(UAT_CDN_DOMAINS)'
  storage_account: '$(UAT_STORAGE_ACCOUNT_NAME)'
  resource_group: '$(UAT_STORAGE_ACCOUNT_RG)'
  deploy_path: '$(UAT_VITE_DEPLOY_PATH)'
  api_timeout: 0
  api_host: '$(UAT_VITE_APIHOST)'
  fileshare_host: '$(UAT_VITE_APIHOST_FILESHARE)'
  login_url: '$(UAT_VITE_LOGIN_URL)'
  openapi_url: '$(UAT_OPENAPI_URL)'
  openapi_fileshare_url: '$(UAT_OPENAPI_FILESHARE_URL)'
  resources_url: '$(UAT_VITE_RESOURCES_URL)'
  extra_modules_path: '$(UAT_EXTRA_MODULES_PATH)'

pool:
  vmImage: '$(vmImageNameDefault)'

stages:
  - stage: prepare_artifact
    displayName: 'Build ${{ variables.environment }} app'
    jobs:
      - job: job_build
        displayName: Build
        steps:
          - template: local-templates/node-job-setup.yaml
    
          - script: |
              cd "$(Build.SourcesDirectory)/src/extra"
              set -euo pipefail
              # backticks instead of $(...) so Azure DevOps macro substitution leaves it alone
              AUTH=`printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0`
              # extra_modules_path may contain a comma-separated list of "giturl#branch" entries
              IFS=',' read -ra REPOS <<< "$(extra_modules_path)"
              for entry in "${REPOS[@]}"; do
                entry="$(echo "$entry" | xargs)"
                [ -z "$entry" ] && continue
                if [[ "$entry" != *"#"* ]]; then
                  echo "Missing #branch in extra_modules_path entry: $entry" >&2
                  exit 1
                fi
                repo="${entry%%#*}"
                branch="${entry#*#}"
                git -c http.extraheader="AUTHORIZATION: basic $AUTH" \
                  clone --depth 1 --branch "$branch" "$repo"
              done
            displayName: 'Clone extra modules'
            env:
              GITHUB_TOKEN: $(GITHUB_TOKEN)


          - template: local-templates/setup-env.yaml
            parameters:
              env: '$(environment)'
              vite_deploy_path: '$(deploy_path)'
              vite_api_timeout: '$(api_timeout)'
              vite_apihost: '$(api_host)'
              vite_apihost_fileshare: '$(fileshare_host)'
              vite_login_url: '$(login_url)'
              vite_resources_url: '$(resources_url)'

          - script: |
              export OPENAPI_URL=$(openapi_url)
              export OPENAPI_FILESHARE_URL=$(openapi_fileshare_url)
              yarn build
            displayName: 'yarn build'

          - publish: dist
            artifact: Bundle

  # Deploy bundle
  - stage: stage_deploy
    displayName: 'Deploy to ${{ variables.environment }} storage'
    condition: succeeded()
    jobs:
      - job: job_deploy
        displayName: 'Deploy'
        steps:
          - checkout: none

          - download: current
            artifact: Bundle

          - task: AzureCLI@2
            displayName: 'Sync storage'
            inputs:
              azureSubscription: '$(AZURE_SUBSCRIPTION)'
              scriptType: 'bash'
              scriptLocation: inlineScript
              inlineScript: |
                az storage blob sync --container '$web' --account-name $(storage_account) --source '$(Pipeline.Workspace)/Bundle' --destination '$(blob_container_path)/'

          - task: AzureCLI@1
            displayName: 'Purge CDN endpoint'
            inputs:
              azureSubscription: '$(AZURE_SUBSCRIPTION)'
              scriptLocation: inlineScript
              inlineScript: |
                az afd endpoint purge -g $(resource_group) --endpoint-name $(cdn_endpoint) --profile-name $(cdn_profile) --domains $(cdn_domains)  --content-paths "/" "/$(blob_container_path)" "/$(blob_container_path)/*"
